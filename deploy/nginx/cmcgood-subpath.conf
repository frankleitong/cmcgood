# 方式一：挂在现有站点的子路径下，例如 https://dev.example.com/cmc/
# 把下面的 location 块粘贴到现有站点的 server { ... } 里，然后 nginx -t && systemctl reload nginx
# 注意：location 和 proxy_pass 末尾的 / 都不能省；X-Forwarded-Prefix 要和路径一致。
# 同时把 /etc/cmcgood/cmcgood.env 里的 SITE_URL 设为 https://dev.example.com/cmc

location = /cmc { return 301 /cmc/; }

location /cmc/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /cmc;
    proxy_read_timeout 60s;
    client_max_body_size 2m;
}
