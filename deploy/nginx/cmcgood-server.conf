# 方式二：独立域名，例如 http(s)://repos.example.com
# 复制到 /etc/nginx/conf.d/cmcgood.conf（或 sites-available 再软链），修改 server_name，
# 然后 nginx -t && systemctl reload nginx
# 同时把 /etc/cmcgood/cmcgood.env 里的 SITE_URL 设为 https://repos.example.com

server {
    listen 80;
    server_name repos.example.com;

    # 有证书时启用 HTTPS（并把 SESSION_COOKIE_SECURE 设为 1）：
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/repos.example.com.pem;
    # ssl_certificate_key /etc/nginx/ssl/repos.example.com.key;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }
}
