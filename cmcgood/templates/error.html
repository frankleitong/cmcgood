{% extends 'base.html' %}
{% block title %}{{ error.code }}{% endblock %}
{% block content %}
<div class="panel empty">
  <h1>{{ {400: '请求有误', 403: '没有权限', 404: '页面不存在'}.get(error.code, '出错了') }}</h1>
  <p>{{ error.description if error.code == 400 else '' }}</p>
  <p><a href="{{ url_for('repos.index') }}">返回首页</a></p>
</div>
{% endblock %}
