{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="auth-box panel">
  <h1>登录</h1>
  <form method="post">
    {{ csrf() }}
    <div class="field"><label>用户名</label><input type="text" name="username" required autofocus value="{{ request.form.username }}"></div>
    <div class="field"><label>密码</label><input type="password" name="password" required></div>
    <button class="btn primary" type="submit">登录</button>
    {% if config.ALLOW_REGISTER %}<span class="muted" style="margin-left:12px">没有账号？<a href="{{ url_for('auth.register') }}">注册</a></span>{% endif %}
  </form>
</div>
{% endblock %}
