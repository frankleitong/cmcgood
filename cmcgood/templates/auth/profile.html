{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block title %}个人设置{% endblock %}
{% block content %}
<div class="page-head"><h1>个人设置</h1></div>
<div class="panel" style="max-width:520px">
  <form method="post">
    {{ csrf() }}
    <div class="field"><label>用户名</label><input type="text" value="{{ g.user.username }}" disabled></div>
    <div class="field"><label>姓名</label><input type="text" name="display_name" value="{{ g.user.display_name }}"></div>
    <div class="field"><label>邮箱</label><input type="email" name="email" value="{{ g.user.email }}"></div>
    <h2 style="margin-top:20px">修改密码 <span class="muted small">（不改请留空）</span></h2>
    <div class="field"><label>当前密码</label><input type="password" name="old_password"></div>
    <div class="row">
      <div class="field"><label>新密码</label><input type="password" name="password" minlength="8"></div>
      <div class="field"><label>确认新密码</label><input type="password" name="password2" minlength="8"></div>
    </div>
    <button class="btn primary" type="submit">保存</button>
  </form>
</div>
{% endblock %}
